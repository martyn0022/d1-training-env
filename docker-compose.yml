services:
  iris:
    build: .
    image: d1-training-env:latest
    hostname: iris
    container_name: d1-iris
    # Bound to 127.0.0.1: the login is public, so keep the instance off the
    # attendee's network.
    ports:
      # Web server: Management Portal, /api/d1claims, VS Code ObjectScript
      - "127.0.0.1:52773:52773"
      # Superserver: DB-API / JDBC / ODBC clients
      - "127.0.0.1:9091:1972"
    volumes:
      # Durable %SYS -- keeps the namespace, the data AND the classes
      # attendees write, across container restarts.
      - ./data/durable:/dur
    environment:
      - ISC_DATA_DIRECTORY=/dur/iris_conf.d
      # Creates the D1DEV namespace and clears the forced password change.
      # Applied at every start, before the superserver opens.
      - ISC_CPF_MERGE_FILE=/opt/d1/merge.cpf
    # Runs AFTER IRIS is live. First start loads the classes, creates the web
    # application and seeds the data; later starts detect the sentinel and do
    # nothing, so restarts never duplicate data or overwrite attendee work.
    command: ["-a", "/opt/d1/setup/after-start.sh"]
